[package]
name = "subhub-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ai-subhub"
path = "src/main.rs"

[dependencies]
subhub-core = { path = "../subhub-core" }
anyhow.workspace = true
chrono.workspace = true
serde_json.workspace = true
uuid.workspace = true
futures = "0.3"
raw-window-handle = "0.6"
# Exact pair used by gpui-component itself; bump together (ADR 0001).
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11" }
gpui-component = "=0.9.0"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Devices_Display",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_Security",
    "Win32_Graphics_Dwm",
    "Win32_System_Registry",
    "Win32_Storage_Xps",
    "Win32_System_DataExchange",
] }
image = { version = "0.25", default-features = false, features = ["png"] }
gpui-kit-assets = "=0.9.0"
# Same version GPUI already builds: renders the app icon SVG for the window and exe icons.
resvg = { version = "0.45", default-features = false }

[build-dependencies]
embed-resource = "3"
